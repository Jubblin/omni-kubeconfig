# Local checks aligned with CI (.github/workflows/ci.yml) — fast enough for every commit.
# Skips: go test, cross-compile, goreleaser, SBOM/Trivy (run via make check / make dc-check).
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      # gofmt + goimports (see .golangci.yml formatters)
      - id: golangci-lint-fmt
      # Incremental lint on commit; use `make pre-commit` for a full pass before PRs
      - id: golangci-lint
        args: [--timeout=10m]
      - id: golangci-lint-config-verify

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet -buildvcs=false ./...
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      # Matches make hadolint (Docker); only runs when Dockerfile changes
      - id: hadolint-docker
        files: ^Dockerfile$
