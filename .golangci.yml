version: "2"

run:
  timeout: 5m
  build-vcs: false

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports

formatters-settings:
  goimports:
    local-prefixes:
      - github.com/Jubblin/omni-kubeconfig

issues:
  exclude-use-default: false
