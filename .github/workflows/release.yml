name: Release

on:
  workflow_call:
  push:
    tags:
      # Semver releases only — exclude v*-snapshot (published via workflow_call from CI).
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jubblin/omni-kubeconfig

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
      attestations: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      is_snapshot: ${{ steps.release.outputs.snapshot }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release metadata
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v[0-9]* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
            # GHCR release tags use Version without leading v (e.g. 0.1.2).
            echo "image_tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            # Use semver release tags only; snapshot releases create v*-snapshot git tags
            # that git describe would pick up and double-append -snapshot.
            LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            TAG="${LATEST_TAG}-snapshot"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
            # Snapshot GHCR tag keeps the leading v (e.g. v0.1.1-snapshot).
            echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create snapshot tag for GoReleaser
        if: steps.release.outputs.snapshot == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Dockerfile (misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 1

      # Real release (not --snapshot) so dockers_v2 can push multi-arch manifests.
      # Snapshot path force-tags v*-snapshot above; tag pushes use the pushed semver tag.
      # dockers_v2 pushes only sha-<commit>; mutable tags are promoted after Trivy below.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
          # CI already ran go test; skip duplicate in before hooks (tag pushes still test).
          SKIP_BEFORE_TEST: ${{ github.event_name == 'workflow_call' && '1' || '0' }}

      - name: Resolve image digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:sha-${GITHUB_SHA}" --format '{{println .Manifest.Digest}}')"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ env.IMAGE }}:sha-${GITHUB_SHA}@${DIGEST}"

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # Promote mutable tags only after Trivy passes (P5 scan-before-mutable-tag).
      - name: Promote image tags
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          IS_SNAPSHOT: ${{ steps.release.outputs.snapshot }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          SOURCE="${{ env.IMAGE }}@${DIGEST}"
          TAGS=("-t" "${{ env.IMAGE }}:${IMAGE_TAG}")
          if [[ "${IS_SNAPSHOT}" != "true" ]]; then
            MAJOR_MINOR="$(echo "${IMAGE_TAG}" | cut -d. -f1,2)"
            TAGS+=("-t" "${{ env.IMAGE }}:${MAJOR_MINOR}" "-t" "${{ env.IMAGE }}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${SOURCE}"
          echo "Promoted ${SOURCE} -> ${TAGS[*]}"

      - name: Generate container SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx
          output: dist/sbom-image.cyclonedx.json

      - name: Verify container SBOM
        run: test -s dist/sbom-image.cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign module SBOM (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          test -f dist/sbom.cyclonedx.json
          cosign sign-blob --yes dist/sbom.cyclonedx.json \
            --bundle dist/sbom.cyclonedx.json.bundle

      - name: Upload SBOM signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            dist/sbom.cyclonedx.json.bundle \
            --clobber

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}"

      - name: Attach SBOM attestation
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign attach sbom --sbom dist/sbom-image.cyclonedx.json \
            "${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}"

      - name: Sign container SBOM blob
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign-blob --yes dist/sbom-image.cyclonedx.json \
            --bundle dist/sbom-image.cyclonedx.json.bundle

      - name: Upload signed container SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-image-signed
          path: |
            dist/sbom-image.cyclonedx.json
            dist/sbom-image.cyclonedx.json.bundle
