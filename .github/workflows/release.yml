name: Release

on:
  workflow_call:
  push:
    tags:
      # Semver releases only — exclude v*-snapshot.N (published via workflow_call from CI).
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jubblin/omni-kubeconfig

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release metadata
        id: release
        run: |
          set -euo pipefail
          # Same invariant as on.push.tags: full releases are exact vX.Y.Z only.
          if [[ "${GITHUB_REF}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
            # GHCR release tags use Version without leading v (e.g. 0.1.2).
            echo "image_tag=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "floating_snapshot_tag=" >> "$GITHUB_OUTPUT"
          else
            # Semver release tags only — ignore v*-snapshot(.N) so we never double-append.
            LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            # Unique immutable tags: v0.2.0-snapshot.1, .2, … (scripts/next-snapshot-tag.sh).
            TAG="$(bash scripts/next-snapshot-tag.sh "${LATEST_TAG}")"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
            # Snapshot GHCR keeps leading v (e.g. v0.2.0-snapshot.3).
            echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
            # Floating alias for "latest on this line" after Trivy.
            echo "floating_snapshot_tag=${LATEST_TAG}-snapshot" >> "$GITHUB_OUTPUT"
            echo "Snapshot release: ${TAG} (line ${LATEST_TAG})"
          fi

      - name: Create snapshot tag for GoReleaser
        if: steps.release.outputs.snapshot == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists; refusing to overwrite"
            exit 1
          fi
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Created immutable snapshot tag ${TAG} -> ${GITHUB_SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile config scan lives in docker.yml (Dockerfile path changes only).
      # Image Trivy below still uses cache-dir outside the workspace so trivy-action
      # does not dirty the tree (default ${{ github.workspace }}/.cache/trivy).

      # Real release (not --snapshot) so dockers_v2 can push multi-arch manifests.
      # Snapshot path creates immutable v*-snapshot.N tags above; semver tag pushes use the tag.
      # dockers_v2 pushes only sha-<commit>; mutable tags are promoted after Trivy below.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
          # CI already ran go test; skip duplicate in before hooks (tag pushes still test).
          SKIP_BEFORE_TEST: ${{ github.event_name == 'workflow_call' && '1' || '0' }}

      - name: Resolve image digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:sha-${GITHUB_SHA}" --format '{{println .Manifest.Digest}}')"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ env.IMAGE }}:sha-${GITHUB_SHA}@${DIGEST}"

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy-cache

      # Promote mutable tags only after Trivy passes (P5 scan-before-mutable-tag).
      - name: Promote image tags
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          IS_SNAPSHOT: ${{ steps.release.outputs.snapshot }}
          FLOATING_SNAPSHOT_TAG: ${{ steps.release.outputs.floating_snapshot_tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          SOURCE="${{ env.IMAGE }}@${DIGEST}"
          TAGS=("-t" "${{ env.IMAGE }}:${IMAGE_TAG}")
          if [[ "${IS_SNAPSHOT}" == "true" ]]; then
            # Numbered tag plus floating alias for the release line (e.g. v0.2.0-snapshot).
            if [[ -n "${FLOATING_SNAPSHOT_TAG}" ]]; then
              TAGS+=("-t" "${{ env.IMAGE }}:${FLOATING_SNAPSHOT_TAG}")
            fi
          else
            MAJOR_MINOR="$(echo "${IMAGE_TAG}" | cut -d. -f1,2)"
            TAGS+=("-t" "${{ env.IMAGE }}:${MAJOR_MINOR}" "-t" "${{ env.IMAGE }}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${SOURCE}"
          echo "Promoted ${SOURCE} -> ${TAGS[*]}"

      - name: Generate container SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx
          output: dist/sbom-image.cyclonedx.json
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Verify container SBOM
        run: test -s dist/sbom-image.cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign module SBOM (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          test -f dist/sbom.cyclonedx.json
          cosign sign-blob --yes dist/sbom.cyclonedx.json \
            --bundle dist/sbom.cyclonedx.json.bundle

      - name: Upload SBOM signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            dist/sbom.cyclonedx.json.bundle \
            --clobber

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}"

      - name: Attach SBOM attestation
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign attach sbom --sbom dist/sbom-image.cyclonedx.json \
            "${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}"

      - name: Sign container SBOM blob
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign-blob --yes dist/sbom-image.cyclonedx.json \
            --bundle dist/sbom-image.cyclonedx.json.bundle

      - name: Upload signed container SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-image-signed
          path: |
            dist/sbom-image.cyclonedx.json
            dist/sbom-image.cyclonedx.json.bundle
