name: Release

on:
  workflow_call:
  push:
    tags:
      # Semver releases only — exclude v*-snapshot.N (published via workflow_call from CI).
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

# Serialize publishes per ref. Do not cancel in-progress runs — mid-publish cancel
# can leave an immutable snapshot tag without a completed promote/attest.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jubblin/omni-kubeconfig

jobs:
  # Phase 1: compute tag metadata + create immutable snapshot git tags.
  meta:
    name: Meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      snapshot: ${{ steps.release.outputs.snapshot }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      floating_snapshot_tag: ${{ steps.release.outputs.floating_snapshot_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: release
        run: |
          set -euo pipefail
          # Same invariant as on.push.tags: full releases are exact vX.Y.Z only.
          if [[ "${GITHUB_REF}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
            echo "image_tag=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "floating_snapshot_tag=" >> "$GITHUB_OUTPUT"
          else
            LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            TAG="$(bash scripts/next-snapshot-tag.sh "${LATEST_TAG}")"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "floating_snapshot_tag=${LATEST_TAG}-snapshot" >> "$GITHUB_OUTPUT"
            echo "Snapshot release: ${TAG} (line ${LATEST_TAG})"
          fi

      - name: Create snapshot tag for GoReleaser
        if: steps.release.outputs.snapshot == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists; refusing to overwrite"
            exit 1
          fi
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Created immutable snapshot tag ${TAG} -> ${GITHUB_SHA}"

  # Phase 2: GoReleaser publish (immutable sha-<commit> image + GH release assets).
  publish:
    name: Publish
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # meta may have just pushed a new snapshot tag — check out that ref.
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes: CI did not gate this run — test before publish.
      # workflow_call from CI already ran make test.
      - name: Test (tag pushes)
        if: github.event_name != 'workflow_call'
        run: go test -buildvcs=false ./...

      # Real release (not --snapshot) so dockers_v2 can push multi-arch manifests.
      # dockers_v2 pushes only sha-<commit>; mutable tags are promoted after Trivy.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.meta.outputs.tag }}

      - name: Resolve image digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:sha-${GITHUB_SHA}" --format '{{println .Manifest.Digest}}')"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ env.IMAGE }}:sha-${GITHUB_SHA}@${DIGEST}"

      - name: Upload module SBOM for attest
        uses: actions/upload-artifact@v7
        with:
          name: module-sbom
          path: dist/sbom.cyclonedx.json
          if-no-files-found: error

  # Phase 3: Trivy image scan — gates mutable tag promotion.
  scan:
    name: Scan
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy-cache

  # Phase 4: promote mutable GHCR tags only after scan passes.
  promote:
    name: Promote
    needs: [meta, publish, scan]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image tags
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          IS_SNAPSHOT: ${{ needs.meta.outputs.snapshot }}
          FLOATING_SNAPSHOT_TAG: ${{ needs.meta.outputs.floating_snapshot_tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          SOURCE="${{ env.IMAGE }}@${DIGEST}"
          TAGS=("-t" "${{ env.IMAGE }}:${IMAGE_TAG}")
          if [[ "${IS_SNAPSHOT}" == "true" ]]; then
            if [[ -z "${FLOATING_SNAPSHOT_TAG}" ]]; then
              echo "::error::floating_snapshot_tag empty on snapshot path"
              exit 1
            fi
            TAGS+=("-t" "${{ env.IMAGE }}:${FLOATING_SNAPSHOT_TAG}")
          else
            MAJOR_MINOR="$(echo "${IMAGE_TAG}" | cut -d. -f1,2)"
            TAGS+=("-t" "${{ env.IMAGE }}:${MAJOR_MINOR}" "-t" "${{ env.IMAGE }}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${SOURCE}"
          echo "Promoted ${SOURCE} -> ${TAGS[*]}"

  # Phase 5: Cosign + SBOM attest after promote.
  attest:
    name: Attest
    needs: [meta, publish, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Download module SBOM
        uses: actions/download-artifact@v7
        with:
          name: module-sbom
          path: dist

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: cyclonedx
          output: dist/sbom-image.cyclonedx.json
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest release artifacts (Cosign + SBOM upload)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-attest.sh \
            "${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}" \
            "${{ needs.meta.outputs.tag }}"

      - name: Upload signed container SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-image-signed
          path: |
            dist/sbom-image.cyclonedx.json
            dist/sbom-image.cyclonedx.json.bundle
