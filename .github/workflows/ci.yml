name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

      - name: Build (host)
        run: make build VERSION=0.0.0-ci

  build-platforms:
    name: Build ${{ matrix.id }}
    needs: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: darwin-amd64
            goos: darwin
            goarch: amd64
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
          - id: linux-amd64
            goos: linux
            goarch: amd64
          - id: linux-arm64
            goos: linux
            goarch: arm64
          - id: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        run: make build-platform GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=0.0.0-ci

      - name: Verify artifact
        shell: bash
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          bin="bin/omni-kubeconfig-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          test -f "$bin"
          file "$bin" || true

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate CycloneDX SBOM (Go modules)
        run: make sbom

      - name: Verify SBOM artifact
        run: test -s dist/sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: dist/sbom.cyclonedx.json
          if-no-files-found: error

  trivy:
    name: Trivy
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Scan Go dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Prepare dist
        run: mkdir -p dist

      - name: Generate filesystem SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: dist/sbom-fs.cyclonedx.json

      - name: Upload filesystem SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-fs-cyclonedx
          path: dist/sbom-fs.cyclonedx.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
  release:
    name: Release (snapshot)
    needs: [test, lint, goreleaser, sbom, build-platforms]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      actions: write
      packages: write
      attestations: write

