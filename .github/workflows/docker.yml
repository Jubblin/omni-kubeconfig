name: Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  IMAGE: omni-kubeconfig:ci

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          verbose: true
          failure-threshold: warning

  docker:
    name: Build image
    needs: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Stage linux/amd64 release binary
        run: |
          mkdir -p dist
          make build-platform GOOS=linux GOARCH=amd64 VERSION=0.0.0-ci
          cp bin/omni-kubeconfig-linux-amd64 dist/omni-kubeconfig-linux-amd64
          chmod +x dist/omni-kubeconfig-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (CI — no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: docker run --rm ${{ env.IMAGE }} --version

      - name: Export image tarball
        run: docker save ${{ env.IMAGE }} | gzip -1 > image.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  trivy:
    name: Trivy
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan Dockerfile (misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Load image tarball
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Import image
        run: gunzip -c image.tar.gz | docker load

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Prepare dist
        run: mkdir -p dist

      - name: Generate container SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: dist/sbom-image.cyclonedx.json

      - name: Verify container SBOM
        run: test -s dist/sbom-image.cyclonedx.json

      - name: Prepare SBOM artifact for upload
        run: cp dist/sbom-image.cyclonedx.json sbom-image.cyclonedx.json

      - name: Upload container SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-image-cyclonedx
          path: sbom-image.cyclonedx.json
