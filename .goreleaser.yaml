# Release targets match omnictl binaries from siderolabs/omni:
#   darwin-amd64, darwin-arm64, linux-amd64, linux-arm64, windows-amd64.exe
# (no windows/arm64 — same as upstream Dockerfile omnictl-* targets)
#
# Container images are built/pushed via dockers_v2 (buildx multi-arch manifests).

version: 2

project_name: omni-kubeconfig

snapshot:
  # Tag is already v*-snapshot from the workflow; avoid appending -snapshot twice.
  version_template: "{{ .Tag }}"

before:
  hooks:
    - go mod download
    - go test -buildvcs=false ./...
    - go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0

builds:
  - id: omni-kubeconfig
    main: ./cmd/omni-kubeconfig
    binary: omni-kubeconfig
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Jubblin/omni-kubeconfig/internal/version.Version={{.Version}}
      - -X github.com/Jubblin/omni-kubeconfig/internal/version.Commit={{.Commit}}
      - -X github.com/Jubblin/omni-kubeconfig/internal/version.Date={{.Date}}

archives:
  - id: binaries
    ids:
      - omni-kubeconfig
    formats:
      - binary
    # Match omnictl asset names: omni-kubeconfig-darwin-amd64, omni-kubeconfig-windows-amd64.exe
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: sha256sum.txt

# Module SBOM (CycloneDX JSON) attached to the GitHub release.
# See https://github.com/CycloneDX/cyclonedx-gomod#-goreleaser-
sboms:
  - id: module
    documents:
      - sbom.cyclonedx.json
    artifacts: any
    cmd: cyclonedx-gomod
    args: ["mod", "-licenses", "-json", "-output", "$document", "../"]

dockers_v2:
  - id: ghcr
    ids:
      - omni-kubeconfig
    dockerfile: Dockerfile
    images:
      - ghcr.io/jubblin/omni-kubeconfig
    # Snapshot/prerelease (v*-snapshot): Tag only.
    # Full release: Version (no v), major.minor, latest.
    tags:
      - "{{ if .Prerelease }}{{ .Tag }}{{ else }}{{ .Version }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "https://github.com/Jubblin/omni-kubeconfig"
    annotations:
      "org.opencontainers.image.description": "Omni multi-cluster kubeconfig sync"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  prerelease: auto
  # Snapshot tags must not become the repo "latest" release.
  make_latest: "{{ not .Prerelease }}"
  replace_existing_artifacts: true
  mode: replace
  target_commitish: "{{ .Commit }}"
